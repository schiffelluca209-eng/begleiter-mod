name: Mod bauen
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - name: Projektordner finden
        id: find
        run: echo "dir=$(dirname "$(find . -name settings.gradle | head -1)")" >> "$GITHUB_OUTPUT"
      - name: Bauen
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: begleiter-mod
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
